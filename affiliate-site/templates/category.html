{% extends "base.html" %}
{% block title %}{{ category|title }} — {{ site.site_name }}{% endblock %}
{% block content %}
  <h1>Catégorie: {{ category|title }}</h1>
  <ul class="list">
  {% for post in posts %}
    <li>
      <a href="/{{ post.slug }}/">{{ post.title }}</a>
      <span class="muted"> · {{ post.date|datefmt }} · {{ post.reading_minutes }} min</span>
    </li>
  {% endfor %}
  </ul>
{% endblock %}
